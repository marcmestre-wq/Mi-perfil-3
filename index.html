document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rection: column; align-items: flex-start; gap: 26px;\">\n      <span style=\"font-size: 14px; font-weight: 600; letter-spacing: -0.224px; color: #7a7a7a;\">Psicología y psicopedagogía infanto-juvenil<\u002Fspan>\n      <h1 style=\"margin: 0; max-width: 20ch; font-size: clamp(34px, 5.4vw, 56px); font-weight: 600; line-height: 1.07; letter-spacing: -0.03em;\">Psicóloga infanto-juvenil en Barcelona<\u002Fh1>\n      <p style=\"margin: 0; max-width: 52ch; font-size: 21px; font-weight: 400; line-height: 1.45; color: #333333;\">Evaluación de TDAH, dislexia y TEA, terapia y acompañamiento a familias y escuelas. Diez años de trabajo, caso a caso.<\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 12px; padding-top: 4px;\">\n        <a href=\"{{ hrefAgenda }}\" style=\"display: inline-flex; align-items: center; height: 44px; padding: 0 24px; border-radius: 9999px; background: #356e5b; color: #ffffff; font-size: 17px; letter-spacing: -0.374px;\" style-hover=\"text-decoration: none; background: #3d7f68;\">Agenda una llamada<\u002Fa>\n        <a href=\"#servicios\" style=\"display: inline-flex; align-items: center; height: 44px; padding: 0 24px; border-radius: 9999px; border: 1px solid #356e5b; color: #356e5b; font-size: 17px; letter-spacing: -0.374px;\" style-hover=\"text-decoration: none; background: rgba(53,110,91,0.07);\">Ver los servicios<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width: 1080px; margin: clamp(40px, 6vw, 64px) auto 0; aspect-ratio: 21 / 9; border-radius: 18px; overflow: hidden; background: #f5f5f7;\">\n      <img src=\"1b0fef70-2cb1-4250-9308-9767db333b3a\" alt=\"Consulta de psicología infanto-juvenil en Barcelona\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: center 60%; display: block;\">\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding: clamp(48px, 6vw, 72px) clamp(20px, 5vw, 64px); background: #ffffff;\">\n    <div style=\"max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px;\">\n      <a href=\"#servicios\" style=\"display: flex; flex-direction: column; gap: 10px; padding: 28px 32px; border: 1px solid #e0e0e0; border-radius: 18px; color: #1d1d1f;\" style-hover=\"text-decoration: none; border-color: #356e5b;\">\n        <span style=\"font-size: 21px; font-weight: 600; letter-spacing: -0.02em;\">Soy familia<\u002Fspan>\n        <span style=\"font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: #333333;\">Busco evaluación, diagnóstico o terapia para mi hijo o hija.<\u002Fspan>\n        <span style=\"font-size: 17px; letter-spacing: -0.374px; color: #356e5b;\">Ver servicios para familias<\u002Fspan>\n      <\u002Fa>\n      <a href=\"#escuelas\" style=\"display: flex; flex-direction: column; gap: 10px; padding: 28px 32px; border: 1px solid #e0e0e0; border-radius: 18px; color: #1d1d1f;\" style-hover=\"text-decoration: none; border-color: #356e5b;\">\n        <span style=\"font-size: 21px; font-weight: 600; letter-spacing: -0.02em;\">Soy un centro educativo<\u002Fspan>\n        <span style=\"font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: #333333;\">Busco psicóloga de centro, orientación o una conferencia para el claustro.<\u002Fspan>\n        <span style=\"font-size: 17px; letter-spacing: -0.374px; color: #356e5b;\">Ver servicios para escuelas<\u002Fspan>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"servicios\" style=\"padding: clamp(64px, 8vw, 96px) clamp(20px, 5vw, 64px); background: #f5f5f7;\">\n    <div style=\"max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 62ch;\">\n        <h2 style=\"margin: 0; font-size: clamp(28px, 3.6vw, 40px); font-weight: 600; line-height: 1.1; letter-spacing: -0.02em;\">Ámbitos de trabajo<\u002Fh2>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: #333333;\">Cada proceso empieza con una primera visita para entender la situación. A partir de ahí definimos juntos el plan y los objetivos.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px;\">\n        <div style=\"background: #ffffff; border: 1px solid #e0e0e0; border-radius: 18px; padding: 32px; display: flex; flex-direction: column; gap: 14px;\">\n          <span style=\"width: 28px; height: 28px; border-radius: 9999px; background: #356e5b;\"><\u002Fspan>\n          <h3 style=\"margin: 0; font-size: 21px; font-weight: 600; line-height: 1.19;\">Evaluación neuropsicológica<\u002Fh3>\n          <p style=\"margin: 0; font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: #333333;\">Detección y tratamiento de TDAH, dislexia y trastornos del espectro autista. Informe claro y orientaciones concretas para casa y para la escuela.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #ffffff; border: 1px solid #e0e0e0; border-radius: 18px; padding: 32px; display: flex; flex-direction: column; gap: 14px;\">\n          <span style=\"width: 28px; height: 28px; border-radius: 9999px; background: #356e5b;\"><\u002Fspan>\n          <h3 style=\"margin: 0; font-size: 21px; font-weight: 600; line-height: 1.19;\">Salud mental y emocional<\u002Fh3>\n          <p style=\"margin: 0; font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: #333333;\">Ansiedad, estado de ánimo, trauma y dificultades de regulación emocional. Terapia adaptada a la edad y al momento de cada niño o adolescente.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #ffffff; border: 1px solid #e0e0e0; border-radius: 18px; padding: 32px; display: flex; flex-direction: column; gap: 14px;\">\n          <span style=\"width: 28px; height: 28px; border-radius: 9999px; background: #356e5b;\"><\u002Fspan>\n          <h3 style=\"margin: 0; font-size: 21px; font-weight: 600; line-height: 1.19;\">Desarrollo y relaciones<\u002Fh3>\n          <p style=\"margin: 0; font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: #333333;\">Habilidades sociales, autoestima y convivencia. Trabajo también con familias y con equipos docentes para acompañar el proceso.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #ffffff; border: 1px solid #e0e0e0; border-radius: 18px; padding: 32px; display: flex; flex-direction: column; gap: 14px;\">\n          <span style=\"width: 28px; height: 28px; border-radius: 9999px; background: #356e5b;\"><\u002Fspan>\n          <h3 style=\"margin: 0; font-size: 21px; font-weight: 600; line-height: 1.19;\">Conferencias y formación<\u002Fh3>\n          <p style=\"margin: 0; font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: #333333;\">Charlas para escuelas que me contratan sobre temas de psicología infantil: TDAH, dificultades de aprendizaje, atención y gestión emocional. Sesiones para claustros y para familias.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"escuelas\" style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; background: #ffffff; border: 1px solid #e0e0e0; border-radius: 18px; padding: 28px 32px; scroll-margin-top: 72px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px; max-width: 60ch;\">\n          <span style=\"font-size: 17px; font-weight: 600; letter-spacing: -0.374px;\">Para escuelas y centros educativos<\u002Fspan>\n          <span style=\"font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: #333333;\">Psicóloga de centro y orientación psicopedagógica, con seguimiento del alumnado y coordinación con el equipo docente durante el curso.<\u002Fspan>\n        <\u002Fdiv>\n        <a href=\"#contacto\" style=\"font-size: 17px; letter-spacing: -0.374px; white-space: nowrap;\">Hablemos del centro<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"sobre-mi\" style=\"padding: clamp(64px, 8vw, 96px) clamp(20px, 5vw, 64px); background: #272729; color: #ffffff;\">\n    <div class=\"om-2col\" style=\"max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: clamp(32px, 5vw, 72px); align-items: center;\">\n      <div class=\"om-2col-media\" style=\"aspect-ratio: 1 / 1; width: 100%; border-radius: 18px; overflow: hidden; background: #2a2a2c;\">\n        <img src=\"23cd2324-1a25-4d85-9edc-bb10c0e6c6c6\" alt=\"Sònia Mestre Martínez\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: center 18%; display: block;\">\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 22px;\">\n        <h2 style=\"margin: 0; font-size: clamp(28px, 3.6vw, 40px); font-weight: 600; line-height: 1.1; letter-spacing: -0.02em;\">Sobre mí<\u002Fh2>\n        <p style=\"margin: 0; font-size: 21px; line-height: 1.45; color: #ffffff;\">Soy psicóloga y psicopedagoga, especializada en población infanto-juvenil.<\u002Fp>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.55; letter-spacing: -0.374px; color: #cccccc;\">Dirijo un centro de psicología y psicopedagogía centrado en la evaluación y el tratamiento de niños y adolescentes. Abordamos cada caso con profesionalidad y cercanía, y ponemos en alza los valores de la consulta.<\u002Fp>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.55; letter-spacing: -0.374px; color: #cccccc;\">En paralelo trabajo como orientadora educativa en instituto y como formadora en la Fundación ADANA, en el ámbito del TDAH. Esa doble mirada, consulta y escuela, es la que traslado a cada caso.<\u002Fp>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.55; letter-spacing: -0.374px; color: #cccccc;\">Trabajo con las familias desde el primer día. Explico qué observo, qué proponemos y qué podemos esperar en cada fase, sin tecnicismos innecesarios.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding: clamp(64px, 8vw, 96px) clamp(20px, 5vw, 64px); background: #ffffff;\">\n    <div style=\"max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px;\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <span style=\"font-size: clamp(34px, 4vw, 44px); font-weight: 600; letter-spacing: -0.02em;\">10 años<\u002Fspan>\n          <span style=\"font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: #7a7a7a;\">de experiencia clínica<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <span style=\"font-size: clamp(34px, 4vw, 44px); font-weight: 600; letter-spacing: -0.02em;\">4<\u002Fspan>\n          <span style=\"font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: #7a7a7a;\">titulaciones: psicología, forense, logopedia escolar y psicopedagogía<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <span style=\"font-size: clamp(34px, 4vw, 44px); font-weight: 600; letter-spacing: -0.02em;\">6+<\u002Fspan>\n          <span style=\"font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: #7a7a7a;\">centros educativos y consultas en Barcelona<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height: 1px; background: #e0e0e0;\"><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 24px;\">\n        <h3 style=\"margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.02em;\">Trayectoria<\u002Fh3>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px 48px;\">\n          <div style=\"display: flex; gap: 20px; align-items: baseline;\">\n            <span style=\"flex: none; width: 116px; font-size: 14px; letter-spacing: -0.224px; color: #7a7a7a;\">2025 — actualidad<\u002Fspan>\n            <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n              <span style=\"font-size: 17px; font-weight: 600; letter-spacing: -0.374px;\">Orientadora educativa<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: #7a7a7a;\">Institut Joan Salvat Papasseit<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 20px; align-items: baseline;\">\n            <span style=\"flex: none; width: 116px; font-size: 14px; letter-spacing: -0.224px; color: #7a7a7a;\">2021 — actualidad<\u002Fspan>\n            <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n              <span style=\"font-size: 17px; font-weight: 600; letter-spacing: -0.374px;\">Psicóloga y formadora<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: #7a7a7a;\">Fundación ADANA · TDAH<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 20px; align-items: baseline;\">\n            <span style=\"flex: none; width: 116px; font-size: 14px; letter-spacing: -0.224px; color: #7a7a7a;\">2021 — 2025<\u002Fspan>\n            <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n              <span style=\"font-size: 17px; font-weight: 600; letter-spacing: -0.374px;\">Psicóloga del Departament d'Orientació Psicopedagògica<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: #7a7a7a;\">Escolàpies Sant Martí<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 20px; align-items: baseline;\">\n            <span style=\"flex: none; width: 116px; font-size: 14px; letter-spacing: -0.224px; color: #7a7a7a;\">2018 — 2022<\u002Fspan>\n            <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n              <span style=\"font-size: 17px; font-weight: 600; letter-spacing: -0.374px;\">Psicóloga educativa · reeducaciones psicopedagógicas<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: #7a7a7a;\">Centre PiP y Cercles, Centre de Psicologia i Logopèdia<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <a href=\"{{ hrefDossier }}\" sc-camel-on-click=\"{{ abrirDossier }}\" style=\"font-size: 17px; letter-spacing: -0.374px;\">Trayectoria completa en el dossier<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"height: 1px; background: #e0e0e0;\"><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: clamp(32px, 5vw, 64px);\">\n        <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n          <h3 style=\"margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.02em;\">Formación<\u002Fh3>\n          <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n            <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n              <span style=\"font-size: 17px; font-weight: 600; letter-spacing: -0.374px;\">Grado en Psicología · especialización clínica y de la salud<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: #7a7a7a;\">Universitat de Barcelona · 2013–2017<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n              <span style=\"font-size: 17px; font-weight: 600; letter-spacing: -0.374px;\">Máster en Psicopatología legal, forense y criminal<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: #7a7a7a;\">Universitat Internacional de Catalunya · 2017–2018<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n              <span style=\"font-size: 17px; font-weight: 600; letter-spacing: -0.374px;\">Posgrado en Logopedia escolar<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: #7a7a7a;\">Universidad Nebrija · 2019–2020<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n              <span style=\"font-size: 17px; font-weight: 600; letter-spacing: -0.374px;\">Máster en Psicopedagogía · Educational Psychology<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: #7a7a7a;\">UNIR · 2020–2021<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n          <h3 style=\"margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.02em;\">Cómo trabajo<\u002Fh3>\n          <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n            <div style=\"display: flex; gap: 14px;\">\n              <span style=\"font-size: 14px; font-weight: 600; color: #356e5b; padding-top: 3px;\">01<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: #333333;\">Primera visita con la familia para entender el motivo de consulta.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 14px;\">\n              <span style=\"font-size: 14px; font-weight: 600; color: #356e5b; padding-top: 3px;\">02<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: #333333;\">Evaluación con pruebas estandarizadas y observación en contexto.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 14px;\">\n              <span style=\"font-size: 14px; font-weight: 600; color: #356e5              <div>\n                    <div style=\"font-size: 13.5px; font-weight: 600; letter-spacing: -0.2px;\">Máster en Psicopatología legal, forense y criminal<\u002Fdiv>\n                    <div style=\"font-size: 12.5px; color: #7a7a7a;\">Universitat Internacional de Catalunya · 2017–2018<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-size: 13.5px; font-weight: 600; letter-spacing: -0.2px;\">Posgrado en Logopedia escolar<\u002Fdiv>\n                    <div style=\"font-size: 12.5px; color: #7a7a7a;\">Universidad Nebrija · 2019–2020<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-size: 13.5px; font-weight: 600; letter-spacing: -0.2px;\">Máster en Psicopedagogía · Educational Psychology<\u002Fdiv>\n                    <div style=\"font-size: 12.5px; color: #7a7a7a;\">UNIR · 2020–2021<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <h2 style=\"margin: 0 0 14px; font-size: 17px; font-weight: 600; letter-spacing: -0.374px;\">Cómo trabajo<\u002Fh2>\n                <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n                  <div style=\"display: flex; gap: 10px;\"><span style=\"font-size: 11px; font-weight: 600; color: #356e5b; padding-top: 2px;\">01<\u002Fspan><span style=\"font-size: 12.5px; line-height: 1.5; color: #333333;\">Primera visita con la familia para entender el motivo de consulta.<\u002Fspan><\u002Fdiv>\n                  <div style=\"display: flex; gap: 10px;\"><span style=\"font-size: 11px; font-weight: 600; color: #356e5b; padding-top: 2px;\">02<\u002Fspan><span style=\"font-size: 12.5px; line-height: 1.5; color: #333333;\">Evaluación con pruebas estandarizadas y observación en contexto.<\u002Fspan><\u002Fdiv>\n                  <div style=\"display: flex; gap: 10px;\"><span style=\"font-size: 11px; font-weight: 600; color: #356e5b; padding-top: 2px;\">03<\u002Fspan><span style=\"font-size: 12.5px; line-height: 1.5; color: #333333;\">Devolución de resultados y plan de intervención por escrito.<\u002Fspan><\u002Fdiv>\n                  <div style=\"display: flex; gap: 10px;\"><span style=\"font-size: 11px; font-weight: 600; color: #356e5b; padding-top: 2px;\">04<\u002Fspan><span style=\"font-size: 12.5px; line-height: 1.5; color: #333333;\">Seguimiento coordinado con la familia y con la escuela.<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #f5f5f7; border-radius: 14px; padding: 22px 24px; display: flex; flex-direction: column; gap: 8px;\">\n              <div style=\"font-size: 16px; font-weight: 600; letter-spacing: -0.374px;\">¿Hablamos de tu caso o del proyecto de tu centro?<\u002Fdiv>\n              <div style=\"font-size: 12.5px; line-height: 1.5; color: #333333;\">La primera llamada es breve y sin compromiso. Me cuentas la situación y te digo si puedo ayudarte. Primera visita 60 €, online o presencial. Gracias por adelantado.<\u002Fdiv>\n              <div style=\"font-size: 13px; padding-top: 4px;\">{{ email }} · {{ telefono }} · Barcelona<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <footer style=\"padding: 48px clamp(20px, 5vw, 64px); background: #f5f5f7;\">\n    <div style=\"max-width: 1080px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;\">\n      <div style=\"display: flex; align-items: center; gap: 10px;\">\n        <span style=\"position: relative; display: block; width: 26px; height: 18px; flex: none;\">\n          <span style=\"position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-radius: 9999px; border: 1.5px solid #7a7a7a;\"><\u002Fspan>\n          <span style=\"position: absolute; right: 0; top: 0; width: 18px; height: 18px; border-radius: 9999px; border: 1.5px solid #356e5b;\"><\u002Fspan>\n        <\u002Fspan>\n        <span style=\"font-size: 12px; letter-spacing: -0.12px; color: #7a7a7a;\">Sònia Mestre Martínez · Psicóloga y psicopedagoga · Col. núm. {{ colegiada }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 20px;\">\n        <a href=\"{{ hrefEmail }}\" style=\"font-size: 12px; letter-spacing: -0.12px;\">{{ email }}<\u002Fa>\n        <a href=\"#legal\" style=\"font-size: 12px; letter-spacing: -0.12px;\">Aviso legal y privacidad<\u002Fa>\n        <span style=\"font-size: 12px; letter-spacing: -0.12px; color: #7a7a7a;\">v5<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;mostrarTestimonios&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Contenido&quot;},&quot;colegiada&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contenido&quot;},&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;soniamestre27@gmail.com&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contacto&quot;},&quot;telefono&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;+34 627 511 121&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contacto&quot;},&quot;urlAgenda&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contacto&quot;}}\">\nclass Component extends DCLogic {\n  state = { open: 0, dossierAbierto: false };\n  dossierRef = React.createRef();\n  renderVals() {\n    const p = this.props;\n    const email = p.email ?? \"soniamestre27@gmail.com\";\n    const telefono = p.telefono ?? \"+34 627 511 121\";\n    const items = [\n      { q: \"¿A partir de qué edad atendéis?\", a: \"Trabajamos con niños y adolescentes, desde educación infantil hasta el final de la etapa escolar. Las familias también forman parte del proceso.\" },\n      { q: \"¿Cuánto dura una evaluación?\", a: \"Depende del motivo de consulta. Lo habitual son entre tres y cinco sesiones, más una visita de devolución de resultados con el informe por escrito.\" },\n      { q: \"¿Os coordináis con la escuela?\", a: \"Sí, siempre que la familia lo autoriza. La coordinación con el tutor y con el equipo de orientación suele ser clave para que las pautas funcionen.\" },\n      { q: \"¿Hacéis sesiones online?\", a: \"Sí, para seguimiento y para asesoramiento a familias. Las pruebas de evaluación se realizan de forma presencial.\" },\n      { q: \"¿Ofrecéis formación para centros educativos?\", a: \"Sí. Preparo sesiones para claustros y charlas para familias sobre dificultades de aprendizaje, atención y regulación emocional.\" }\n    ];\n    return {\n      mostrarTestimonios: p.mostrarTestimonios ?? true,\n      colegiada: p.colegiada || \"pendiente\",\n      email,\n      telefono,\n      hrefEmail: \"mailto:\" + email,\n      hrefTelefono: \"tel:\" + telefono.replace(/\\s/g, \"\"),\n      hrefAgenda: p.urlAgenda || (\"tel:\" + telefono.replace(/\\s/g, \"\")),\n      hrefDossier: \"#dossier\",\n      dossierAbierto: this.state.dossierAbierto,\n      abrirDossier: (e) => {\n        e.preventDefault();\n        this.setState({ dossierAbierto: true });\n      },\n      cerrarDossier: () => this.setState({ dossierAbierto: false }),\n      imprimirDossier: () => window.print(),\n      faqs: items.map((it, i) => ({\n        q: it.q,\n        a: it.a,\n        open: this.state.open === i,\n        sign: this.state.open === i ? \"−\" : \"+\",\n        toggle: () => this.setState(s => ({ open: s.open === i ? -1 : i }))\n      }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
